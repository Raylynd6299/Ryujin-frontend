<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="lotus-title">
  <title id="lotus-title">Ryujin Logo v3 - Loto del Dragón</title>
  <defs>

    <!-- ═══ FONDOS ═══ -->
    <radialGradient id="l-bg" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   style="stop-color:#100C28"/>
      <stop offset="60%"  style="stop-color:#080614"/>
      <stop offset="100%" style="stop-color:#04030B"/>
    </radialGradient>
    <radialGradient id="l-ambient" cx="50%" cy="60%" r="45%">
      <stop offset="0%"   style="stop-color:#6D28D9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- ═══ PALETA ═══ -->

    <!-- Pétalos exteriores: violeta profundo con borde claro -->
    <linearGradient id="l-petal-outer" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   style="stop-color:#C084FC"/>
      <stop offset="40%"  style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#3B1078"/>
    </linearGradient>

    <!-- Pétalos medios: violeta más vivo -->
    <linearGradient id="l-petal-mid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   style="stop-color:#DDD6FE"/>
      <stop offset="35%"  style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>

    <!-- Pétalos interiores: más claros, casi blancos -->
    <linearGradient id="l-petal-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   style="stop-color:#F5F3FF"/>
      <stop offset="30%"  style="stop-color:#C4B5FD"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>

    <!-- Aro dorado -->
    <linearGradient id="l-gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#FFF3A3"/>
      <stop offset="40%"  style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#C45C00"/>
    </linearGradient>

    <!-- ═══ FILTROS ═══ -->

    <!-- Glow violeta suave — para pétalos -->
    <filter id="l-glow-petal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow dorado — para centro y aro -->
    <filter id="l-glow-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow violeta -->
    <filter id="l-drop-violet">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5B21B6" flood-opacity="0.7"/>
    </filter>

    <!-- Blur para ambiente -->
    <filter id="l-blur-ambient">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Clip círculo principal -->
    <clipPath id="l-clip-circle">
      <circle cx="100" cy="100" r="94"/>
    </clipPath>

  </defs>

  <!-- ════════════════════════════════ -->
  <!--           FONDO                  -->
  <!-- ════════════════════════════════ -->
  <circle cx="100" cy="100" r="99" fill="url(#l-bg)"/>
  <circle cx="100" cy="100" r="90" fill="url(#l-ambient)" filter="url(#l-blur-ambient)"/>

  <!-- ════════════════════════════════ -->
  <!--     ANILLO EXTERIOR              -->
  <!-- ════════════════════════════════ -->
  <!-- Aro dorado exterior -->
  <circle cx="100" cy="100" r="96" fill="none"
    stroke="url(#l-gold-ring)" stroke-width="1.2"
    opacity="0.55" filter="url(#l-glow-gold)"/>
  <!-- Aro violeta interior -->
  <circle cx="100" cy="100" r="92" fill="none"
    stroke="#7C3AED" stroke-width="0.6"
    opacity="0.3"/>

  <!-- ════════════════════════════════ -->
  <!--   CAPA 1: PÉTALOS EXTERIORES    -->
  <!--   (5 pétalos, base ancha)        -->
  <!-- ════════════════════════════════ -->
  <!--
    Forma de loto real: ancho en la base (donde nace del tallo),
    se estrecha suavemente y termina en punta redondeada.
    Control points del cubic bezier clave para esa forma orgánica.

    Pétalo base (sin rotar): nace de y≈118, sube hasta y≈30,
    ancho máximo ≈ 28px a cada lado, centrado en x=100.
  -->

  <!-- Pétalo exterior 1 — 90° (derecha) -->
  <g transform="rotate(90, 100, 100)">
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="url(#l-petal-outer)"
      opacity="0.82"
      filter="url(#l-drop-violet)"/>
    <!-- Borde luminoso del pétalo -->
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="none" stroke="#C084FC" stroke-width="0.7" opacity="0.5"/>
    <!-- Vena central -->
    <line x1="100" y1="108" x2="100" y2="20"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Pétalo exterior 2 — 162° -->
  <g transform="rotate(162, 100, 100)">
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="url(#l-petal-outer)"
      opacity="0.79"
      filter="url(#l-drop-violet)"/>
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="none" stroke="#A78BFA" stroke-width="0.7" opacity="0.45"/>
    <line x1="100" y1="108" x2="100" y2="20"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Pétalo exterior 3 — 234° -->
  <g transform="rotate(234, 100, 100)">
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="url(#l-petal-outer)"
      opacity="0.8"
      filter="url(#l-drop-violet)"/>
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="none" stroke="#C084FC" stroke-width="0.7" opacity="0.45"/>
    <line x1="100" y1="108" x2="100" y2="20"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Pétalo exterior 4 — 306° -->
  <g transform="rotate(306, 100, 100)">
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="url(#l-petal-outer)"
      opacity="0.78"
      filter="url(#l-drop-violet)"/>
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="none" stroke="#A78BFA" stroke-width="0.7" opacity="0.4"/>
    <line x1="100" y1="108" x2="100" y2="20"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.28"/>
  </g>

  <!-- Pétalo exterior 5 — 18° (arriba, el "frontal") -->
  <g transform="rotate(18, 100, 100)">
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="url(#l-petal-outer)"
      opacity="0.85"
      filter="url(#l-drop-violet)"/>
    <path d="M100,118
             C 74,110  62,72  70,42
             C 76,20   90,14  100,14
             C 110,14  124,20 130,42
             C 138,72  126,110 100,118 Z"
      fill="none" stroke="#DDD6FE" stroke-width="0.8" opacity="0.55"/>
    <line x1="100" y1="108" x2="100" y2="20"
      stroke="#F5F3FF" stroke-width="0.8"
      stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- ════════════════════════════════ -->
  <!--   CAPA 2: PÉTALOS MEDIOS        -->
  <!--   (5 pétalos, más cortos)       -->
  <!-- ════════════════════════════════ -->
  <!-- Offset 36° respecto a los exteriores para dar volumen tipo loto real -->

  <!-- Pétalo medio 1 — 54° -->
  <g transform="rotate(54, 100, 100)">
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="url(#l-petal-mid)"
      opacity="0.88"
      filter="url(#l-drop-violet)"/>
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="none" stroke="#DDD6FE" stroke-width="0.7" opacity="0.5"/>
    <line x1="100" y1="102" x2="100" y2="30"
      stroke="#F5F3FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Pétalo medio 2 — 126° -->
  <g transform="rotate(126, 100, 100)">
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="url(#l-petal-mid)"
      opacity="0.85"
      filter="url(#l-drop-violet)"/>
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="none" stroke="#C4B5FD" stroke-width="0.7" opacity="0.45"/>
    <line x1="100" y1="102" x2="100" y2="30"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Pétalo medio 3 — 198° -->
  <g transform="rotate(198, 100, 100)">
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="url(#l-petal-mid)"
      opacity="0.86"
      filter="url(#l-drop-violet)"/>
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="none" stroke="#DDD6FE" stroke-width="0.7" opacity="0.45"/>
    <line x1="100" y1="102" x2="100" y2="30"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Pétalo medio 4 — 270° -->
  <g transform="rotate(270, 100, 100)">
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="url(#l-petal-mid)"
      opacity="0.84"
      filter="url(#l-drop-violet)"/>
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="none" stroke="#C4B5FD" stroke-width="0.7" opacity="0.4"/>
    <line x1="100" y1="102" x2="100" y2="30"
      stroke="#E9D5FF" stroke-width="0.7"
      stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Pétalo medio 5 — 342° -->
  <g transform="rotate(342, 100, 100)">
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="url(#l-petal-mid)"
      opacity="0.9"
      filter="url(#l-drop-violet)"/>
    <path d="M100,112
             C 80,106  70,76  76,52
             C 81,32   91,24  100,24
             C 109,24  119,32 124,52
             C 130,76  120,106 100,112 Z"
      fill="none" stroke="#DDD6FE" stroke-width="0.8" opacity="0.55"/>
    <line x1="100" y1="102" x2="100" y2="30"
      stroke="#F5F3FF" stroke-width="0.8"
      stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- ════════════════════════════════ -->
  <!--   CAPA 3: PÉTALOS INTERIORES    -->
  <!--   (5 pétalos, más angostos)     -->
  <!-- ════════════════════════════════ -->

  <!-- Pétalo interior 1 — 90° -->
  <g transform="rotate(90, 100, 100)">
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="url(#l-petal-inner)"
      opacity="0.93"
      filter="url(#l-glow-petal)"/>
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="none" stroke="#F5F3FF" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- Pétalo interior 2 — 162° -->
  <g transform="rotate(162, 100, 100)">
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="url(#l-petal-inner)"
      opacity="0.9"
      filter="url(#l-glow-petal)"/>
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="none" stroke="#EDE9FE" stroke-width="0.6" opacity="0.55"/>
  </g>

  <!-- Pétalo interior 3 — 234° -->
  <g transform="rotate(234, 100, 100)">
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="url(#l-petal-inner)"
      opacity="0.91"
      filter="url(#l-glow-petal)"/>
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="none" stroke="#F5F3FF" stroke-width="0.6" opacity="0.55"/>
  </g>

  <!-- Pétalo interior 4 — 306° -->
  <g transform="rotate(306, 100, 100)">
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="url(#l-petal-inner)"
      opacity="0.89"
      filter="url(#l-glow-petal)"/>
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="none" stroke="#EDE9FE" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Pétalo interior 5 — 18° -->
  <g transform="rotate(18, 100, 100)">
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="url(#l-petal-inner)"
      opacity="0.95"
      filter="url(#l-glow-petal)"/>
    <path d="M100,104
             C 88,100  82,82  85,64
             C 88,48   94,40  100,40
             C 106,40  112,48 115,64
             C 118,82  112,100 100,104 Z"
      fill="none" stroke="#F5F3FF" stroke-width="0.7" opacity="0.65"/>
  </g>



  <!-- ════════════════════════════════ -->
  <!--   DETALLES FINALES              -->
  <!-- ════════════════════════════════ -->

  <!-- Kanji 龍 en la base — muy sutil -->
  <text x="100" y="180"
    font-family="'Hiragino Mincho Pro', 'Yu Mincho', 'MS Mincho', serif"
    font-size="9" fill="url(#l-gold-ring)"
    text-anchor="middle" opacity="0.35"
    letter-spacing="4" filter="url(#l-glow-gold)">龍 神</text>

</svg>
